complexity:
  TooManyFunctions:
    active: false
  LargeClass:
    active: false
  LongMethod:
    active: false
  CyclomaticComplexMethod:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  TooGenericExceptionThrown:
    active: false

naming:
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    ignoreAnnotated: ['Composable']

style:
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: true
    excludeRawStrings: true
  ThrowsCount:
    active: false
  ReturnCount:
    active: false
  ForbiddenComment:
    active: false
  MagicNumber:
    active: false
  UseCheckOrError:
    active: false
  UseRequire:
    active: false
